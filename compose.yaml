services:
  api:
    build: .
    container_name: task-api

    ports:
      - "3000:3000"

    environment:
      DATABASE_URL: postgres://postgres:dev@db:5432/tasks

    depends_on:
      - db

  db:
    image: postgres:17
    container_name: task-db

    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: dev
      POSTGRES_DB: tasks

    ports:
      - "5432:5432"

    volumes:
      - taskdata:/var/lib/postgresql/data

volumes:
  taskdata: